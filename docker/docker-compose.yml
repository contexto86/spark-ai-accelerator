services:
  spark-notebook:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ..:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    command: start-notebook.py --NotebookApp.token='' --NotebookApp.password=''

